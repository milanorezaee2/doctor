name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # امکان اجرای دستی بدون پوش جدید
  workflow_dispatch:

# جلوگیری از دو بیلد همزمان روی یک رفرنس
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# برای انتشار از طریق GitHub Pages environment لازم است
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Vite 8 به Node ≥ 20.19 نیاز دارد
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Check Tailwind class coverage
        run: node scripts/check-css.mjs

      # enablement: در اولین اجرا خودش Pages را با build_type=workflow می‌سازد
      # (تنظیمات Pages با توکن‌های محدود قابل تغییر نیست، اما با pages:write در همین job بله)
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
