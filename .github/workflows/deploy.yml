name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # برای پوش کردن شاخهٔ gh-pages لازم است

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Vite 8 به Node ≥ 20.19 نیاز دارد
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Check Tailwind class coverage
        run: node scripts/check-css.mjs

      # انتشار روی «Deploy from a branch» — بدون نیاز به هیچ اکشن شخص‌ثالث:
      # محتوای dist با یک force-push به شاخهٔ gh-pages می‌رود.
      # یک‌بار در Settings → Pages کافی است: Source = Deploy from a branch، gh-pages، /(root)
      - name: Publish dist to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/gh-pages
          echo "✓ gh-pages با commit ${GITHUB_SHA:0:7} به‌روزرسانی شد"
